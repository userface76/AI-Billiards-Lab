<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Billiards Lab</title><style>body{margin:0;background:#0b1527;color:#eef4ff;font:16px system-ui}main{max-width:850px;margin:auto;padding:18px}h1{font-size:27px}.panel{background:#182b44;padding:16px;border-radius:18px;margin:16px 0}canvas{width:100%;height:auto;touch-action:none;border-radius:10px}button,select,input{font:inherit}button,select{background:#28517c;color:white;border:1px solid #6992bd;border-radius:9px;padding:11px;margin:4px}button:active{background:#078f8b}label{display:block;margin:12px 0}input[type=range]{width:100%}small{color:#b9cce0}#result{white-space:pre-wrap;line-height:1.65} #tipCanvas{display:block;width:min(100%,250px);height:auto;margin:8px auto;touch-action:none;cursor:crosshair} .tipmeta{text-align:center;color:#c8dcf1;font-size:14px} </style><main><h1>🎱 AI BILLIARDS LAB</h1><p>3쿠션 중급 · 충돌과 쿠션 반사 학습 v0.6</p><section class="panel"><h2 id="title">문제 1</h2><canvas id="table" width="720" height="400"></canvas><p><small>공을 손가락으로 끌어 배치를 바꾸세요. 수구에서 출발하는 화살표가 조준 방향입니다.</small></p><button id="shoot" style="background:#078f8b;font-weight:700">▶ 샷 계산</button><button id="prev">← 이전</button><button id="next">다음 문제 →</button><button id="random">랜덤 배치</button><button id="reset">초기화</button></section><section class="panel"><label>첫 적구 <select id="first"><option value="yellow">노란 공</option><option value="red">빨간 공</option></select></label><label>조준 각도: <b id="angleOut"></b><input id="angle" type="range" min="0" max="359" step="1" value="0"></label><label>샷 속도: <b id="speedOut"></b><input id="speed" type="range" min="2" max="12" step=".5" value="8"></label><section class="panel"><h2>🎯 당점 설정</h2><p><small>아래 수구의 원하는 위치를 터치하세요. 가운데 빨간 점이 기본 당점입니다.</small></p><canvas id="tipCanvas" width="240" height="240" aria-label="수구 당점 선택"></canvas><p class="tipmeta" id="tipLabel">중앙 당점 · 회전 없음</p><button id="tipReset">당점 중앙으로</button></section><button id="hint">첫 적구 방향으로 조준</button><button id="clear">궤적 지우기</button></section><section class="panel"><h2>판정과 해설</h2><div id="result">공을 배치한 뒤 샷 계산을 눌러보세요.</div><p><small>교육용 2D 근사: 동일 질량 공 충돌, 반발계수 및 쿠션 반사·감속 적용. 회전·당점·천 마찰의 정밀 재현은 아직 지원하지 않습니다.</small></p></section></main><script>
const c=document.getElementById('table'),g=c.getContext('2d'),$=id=>document.getElementById(id);
const W=720,H=400,R=11,L=24,T=24,B=376,Q=696;
const layouts=[[[145,290],[295,135],[530,240]],[[185,120],[420,265],[600,120]],[[510,300],[270,160],[120,260]],[[380,315],[560,110],[145,110]],[[100,190],[340,100],[585,310]],[[590,220],[400,315],[180,95]],[[300,300],[130,90],[530,110]],[[510,90],[235,280],[605,305]],[[150,320],[500,310],[340,80]],[[370,160],[135,295],[590,125]]];
let tipX=0,tipY=0;let idx=0,balls=[],paths=[],drag=-1,anim=0,firstHit=false,secondHit=false,cushions=0,shotRunning=false;
function drawTip(){let cv=$('tipCanvas'),t=cv.getContext('2d');t.clearRect(0,0,240,240);t.beginPath();t.arc(120,120,103,0,Math.PI*2);t.fillStyle='#f7f9fc';t.fill();t.lineWidth=3;t.strokeStyle='#8aa7c0';t.stroke();t.strokeStyle='#a3b5c7';t.lineWidth=1;t.beginPath();t.moveTo(17,120);t.lineTo(223,120);t.moveTo(120,17);t.lineTo(120,223);t.stroke();t.beginPath();t.arc(120,120,5,0,7);t.fillStyle='#d92735';t.fill();t.beginPath();t.arc(120+tipX*98,120+tipY*98,10,0,7);t.fillStyle='#177ee8';t.fill();t.strokeStyle='#fff';t.lineWidth=2;t.stroke();let parts=[];if(tipY<-.15)parts.push('상단(밀어치기)');if(tipY>.15)parts.push('하단(끌어치기)');if(tipX<-.15)parts.push('좌회전');if(tipX>.15)parts.push('우회전');$('tipLabel').textContent=(parts.join(' + ')||'중앙 당점')+' · 좌우 '+Math.round(tipX*100)+'% / 상하 '+Math.round(-tipY*100)+'%'}function setTip(e){let cv=$('tipCanvas'),r=cv.getBoundingClientRect(),x=((e.clientX-r.left)/r.width*240-120)/98,y=((e.clientY-r.top)/r.height*240-120)/98,d=Math.hypot(x,y);if(d>1){x/=d;y/=d}tipX=x;tipY=y;drawTip()}$('tipCanvas').addEventListener('pointerdown',e=>{e.currentTarget.setPointerCapture(e.pointerId);setTip(e)});$('tipCanvas').addEventListener('pointermove',e=>{if(e.buttons)setTip(e)});$('tipReset').onclick=()=>{tipX=0;tipY=0;drawTip()};drawTip();function load(){balls=layouts[idx].map(([x,y],i)=>({x,y,vx:0,vy:0,color:['#fff','#ffcc28','#e43e48'][i]}));$('first').value=idx%2?'red':'yellow';paths=[];$('title').textContent='문제 '+(idx+1)+' / '+layouts.length; $('result').textContent='수구를 첫 적구에 맞힌 뒤 3쿠션으로 나머지 공을 맞혀보세요.';aim();draw()}
function aim(){let target=balls[$('first').value==='yellow'?1:2],b=balls[0];$('angle').value=Math.round((Math.atan2(target.y-b.y,target.x-b.x)*180/Math.PI+360)%360);update()}
function update(){$('angleOut').textContent=$('angle').value+'°';$('speedOut').textContent=$('speed').value;draw()}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#69432a';g.fillRect(0,0,W,H);g.fillStyle='#086f92';g.fillRect(L,T,Q-L,B-T);g.strokeStyle='#032c44';g.lineWidth=9;g.strokeRect(L,T,Q-L,B-T);g.fillStyle='#eee0ad';for(let x=80;x<680;x+=80){g.beginPath();g.arc(x,12,3,0,7);g.arc(x,388,3,0,7);g.fill()}for(let y=80;y<370;y+=80){g.beginPath();g.arc(12,y,3,0,7);g.arc(708,y,3,0,7);g.fill()}paths.forEach((p,i)=>{g.beginPath();g.strokeStyle=i===0?'#ffea6c':'#9bd7e5';g.lineWidth=i===0?2.5:1.2;g.moveTo(p[0][0],p[0][1]);p.slice(1).forEach(q=>g.lineTo(q[0],q[1]));g.stroke()});if(!shotRunning&&!paths.length){let a=+$('angle').value*Math.PI/180,b=balls[0];g.beginPath();g.setLineDash([6,5]);g.moveTo(b.x,b.y);let dx=Math.cos(a),dy=Math.sin(a),distance=Infinity,hit=-1,wall='';for(let k=1;k<balls.length;k++){let o=balls[k],vx=o.x-b.x,vy=o.y-b.y,projection=vx*dx+vy*dy,side2=vx*vx+vy*vy-projection*projection,hitRadius=2*R;if(projection>0&&side2<=hitRadius*hitRadius){let contact=projection-Math.sqrt(Math.max(0,hitRadius*hitRadius-side2));if(contact>0&&contact<distance){distance=contact;hit=k}}}let tx=dx>0?(Q-R-b.x)/dx:dx<0?(L+R-b.x)/dx:Infinity,ty=dy>0?(B-R-b.y)/dy:dy<0?(T+R-b.y)/dy:Infinity,wallDist=Math.min(tx,ty);if(wallDist<distance){distance=wallDist;hit=-1;wall=tx<ty?'vertical':'horizontal'}let px=b.x+dx*Math.max(0,distance),py=b.y+dy*Math.max(0,distance);g.lineTo(px,py);g.strokeStyle='#fff';g.lineWidth=2;g.stroke();if(hit>=0){let o=balls[hit],nx=(o.x-px)/(2*R),ny=(o.y-py)/(2*R),dot=dx*nx+dy*ny,rx=dx-dot*nx,ry=dy-dot*ny,mag=Math.hypot(rx,ry);if(mag>.06){rx/=mag;ry/=mag;let t=Infinity;for(let k=1;k<balls.length;k++){if(k===hit)continue;let v=balls[k],ux=v.x-px,uy=v.y-py,proj=ux*rx+uy*ry,side=ux*ux+uy*uy-proj*proj;if(proj>0&&side<(2*R)**2)t=Math.min(t,proj-Math.sqrt(Math.max(0,(2*R)**2-side)))}let wx=rx>0?(Q-R-px)/rx:rx<0?(L+R-px)/rx:Infinity,wy=ry>0?(B-R-py)/ry:ry<0?(T+R-py)/ry:Infinity;t=Math.min(t,wx,wy);if(Number.isFinite(t)&&t>0){g.beginPath();g.moveTo(px,py);g.lineTo(px+rx*t,py+ry*t);g.strokeStyle='#ffe36e';g.stroke()}}}else if(wall){let rx=wall==='vertical'?-dx:dx,ry=wall==='horizontal'?-dy:dy;let wx=rx>0?(Q-R-px)/rx:rx<0?(L+R-px)/rx:Infinity,wy=ry>0?(B-R-py)/ry:ry<0?(T+R-py)/ry:Infinity,t=Math.min(wx,wy);if(Number.isFinite(t)&&t>0){g.beginPath();g.moveTo(px,py);g.lineTo(px+rx*t,py+ry*t);g.strokeStyle='#ffe36e';g.stroke()}}g.setLineDash([])}balls.forEach((b,i)=>{g.beginPath();g.arc(b.x,b.y,R,0,7);g.fillStyle=b.color;g.fill();g.strokeStyle='#182333';g.lineWidth=1.5;g.stroke();g.fillStyle=i===0?'#111':'#fff';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(i===0?'●':i===1?'Y':'R',b.x,b.y+4)})}
function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
c.addEventListener('pointerdown',e=>{if(shotRunning)return;let [x,y]=point(e);drag=balls.findIndex(b=>Math.hypot(x-b.x,y-b.y)<24);if(drag>=0)c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(drag<0)return;let [x,y]=point(e);balls[drag].x=Math.max(L+R,Math.min(Q-R,x));balls[drag].y=Math.max(T+R,Math.min(B-R,y));paths=[];draw()});
c.addEventListener('pointerup',()=>{drag=-1;draw()});
function shoot(){cancelAnimationFrame(anim);shotRunning=true;paths=balls.map(b=>[[b.x,b.y]]);balls.forEach(b=>{b.vx=0;b.vy=0});let a=+$('angle').value*Math.PI/180;balls[0].vx=Math.cos(a)*+$('speed').value;balls[0].vy=Math.sin(a)*+$('speed').value;firstHit=false;secondHit=false;cushions=0;let ticks=0,primary=$('first').value==='yellow'?1:2,other=primary===1?2:1;let lastCushionTick=-100;
function step(){for(let sub=0;sub<3;sub++){ticks++;balls.forEach((b,i)=>{b.x+=b.vx/3;b.y+=b.vy/3;let hit=false;if(b.x<L+R){b.x=L+R;b.vx=Math.abs(b.vx)*.84;b.vy-=i===0?tipX*1.5:0;hit=true}if(b.x>Q-R){b.x=Q-R;b.vx=-Math.abs(b.vx)*.84;b.vy+=i===0?tipX*1.5:0;hit=true}if(b.y<T+R){b.y=T+R;b.vy=Math.abs(b.vy)*.84;b.vx+=i===0?tipX*1.5:0;hit=true}if(b.y>B-R){b.y=B-R;b.vy=-Math.abs(b.vy)*.84;b.vx-=i===0?tipX*1.5:0;hit=true}if(hit&&i===0&&firstHit&&ticks-lastCushionTick>3){cushions++;lastCushionTick=ticks}if(i===0&&Math.hypot(b.vx,b.vy)>.18){b.vx+=Math.cos(+$('angle').value*Math.PI/180)*(-tipY)*.00015;b.vy+=Math.sin(+$('angle').value*Math.PI/180)*(-tipY)*.00015}b.vx*=.9962;b.vy*=.9962});for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>=2*R||d<.001)continue;let nx=dx/d,ny=dy/d,overlap=2*R-d;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let impulse=-(1+.94)*rel/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;if(i===0||j===0){let k=i===0?j:i;if(!firstHit&&k===primary){firstHit=true;cushions=0}else if(firstHit&&k===other&&cushions>=3)secondHit=true}}}if(ticks%5===0)balls.forEach((b,i)=>paths[i].push([b.x,b.y]))}draw();if(ticks<7500&&balls.some(b=>Math.hypot(b.vx,b.vy)>.12)){anim=requestAnimationFrame(step)}else{shotRunning=false;$('result').textContent=secondHit?'✅ 3쿠션 득점! 첫 적구 충돌 → 쿠션 '+cushions+'회 → 두 번째 적구 충돌.':'미득점. '+(firstHit?'첫 적구 충돌 성공, 수구 쿠션 '+cushions+'회.':'지정된 첫 적구에 맞지 않았습니다.')+'\n각도와 두께(조준 방향)를 바꿔 다시 시도해 보세요.';draw()}}anim=requestAnimationFrame(step)}
$('shoot').onclick=shoot;$('hint').onclick=aim;$('clear').onclick=()=>{cancelAnimationFrame(anim);shotRunning=false;paths=[];draw()};$('next').onclick=()=>{cancelAnimationFrame(anim);shotRunning=false;idx=(idx+1)%layouts.length;load()};$('prev').onclick=()=>{cancelAnimationFrame(anim);shotRunning=false;idx=(idx+layouts.length-1)%layouts.length;load()};$('reset').onclick=()=>{cancelAnimationFrame(anim);shotRunning=false;load()};$('random').onclick=()=>{cancelAnimationFrame(anim);shotRunning=false;idx=(idx+1)%layouts.length;load();balls.forEach(b=>{b.x=L+R+Math.random()*(Q-L-2*R);b.y=T+R+Math.random()*(B-T-2*R)});$('first').value=Math.random()<.5?'yellow':'red';aim()};$('angle').oninput=update;$('speed').oninput=update;$('first').onchange=aim;load();
</script></html>
